# ---------------------------------------------------------------------------
# Adaptive TSK Equity Scoring -- master configuration
# Mirrors the methodology of paper/sn-article-template/name.tex (camera-ready).
# All paths are relative to the project root (this file's directory).
# ---------------------------------------------------------------------------
project:
  name: adaptive-tsk-equity-scoring
  seed: 20250921

paths:
  raw_ohlc: data/raw/ohlc                    # one Investing.com CSV per ticker
  # Per-year financials exports; {year} is expanded from data.financials_years.
  raw_financials_pattern: data/raw/financials/financials-{year}.csv
  raw_dividends: data/raw/financials/dividends.csv   # optional; zeros if absent
  raw_tonia: data/raw/macro/tonia_rbk.xlsx   # daily TONIA close (RBK export)
  raw_fx: data/raw/macro/rate_nbk.xlsx       # daily USD/KZT reference rate (NBK)
  processed: data/processed
  models: outputs/models
  logs: outputs/logs
  csv_exports: outputs/csv_exports
  paper: paper/sn-article-template           # official sn-jnl template dir

data:
  # The seven KASE equities studied in the paper (Section 4.1).
  tickers: [AIRA, KCEL, KEGC, KMGZ, KZAP, KZTK, KZTO]
  ohlc_file_pattern: "{ticker}.csv"
  financials_years: [2022, 2023, 2024, 2025]   # per-year financials files
  market_name: KASE
  trading_days_per_year: 250

features:
  # Section 3.1 -- strictly trailing windows [t-N, t-1] (no lookahead).
  vwap_window: 20            # N in VWAP_{t-1}(N)
  volume_window: 20          # trailing window for the log-volume transform
  epsilon_volume_rel: 1.0e-6 # epsilon = 1e-6 * Mean(V_N), Eq. (2) regulariser
  of_mode: hybrid            # clv | tick | hybrid  (Section 3.1 / Algorithm 1)
  # Winsorise dev_price/dev_volume to training-window percentiles. Estimated on
  # the training window only and applied to every split, so test-period extremes
  # (2025 dev_price reaches -38.9% against a 2024 minimum of -11.2%) cannot push
  # the rule consequents outside the score domain. Without it the fitted model
  # violates Proposition 1's premise: max|y_k - Y_raw| = 195 > 100.
  winsorize: true
  winsor_low_pct: 1.0
  winsor_high_pct: 99.0
  # --- Tier-2 enrichment (opt-in; both off by default) -----------------------
  # Multi-scale microstructure, all trailing/no-lookahead. Any of:
  # dev_price_60 (60-day VWAP deviation), ret_5 (5-day momentum),
  # vol_20 (realised vol, lagged), clv_5 (5-day mean CLV), amihud (illiquidity).
  extra_features: []
  # As-of (point-in-time) slow fundamentals attached with a reporting lag, so a
  # calendar day never sees a disclosure that was not yet public.
  fundamentals: false
  fundamentals_lag_days: 90

target:
  horizon: 30                # primary forward horizon in trading days, Eq. (7)
  # Tier-1 multi-horizon grid (1w / 1m / 1q / 1y in trading days). The primary
  # horizon above is always included, so R30 / Y_target keep their canonical
  # meaning while R5, R21, R63, R252 feed the multi-horizon / period-mark report.
  horizons: [5, 21, 63, 252]
  label_mode: tanh           # tanh (Eq. 10) | rank (cross-sectional percentile in [0,100])
  peer_relative: false       # if true, demean R_h within each date before the tanh label
  aggregation: mean          # period-mark aggregation: mean | median | last | ewma
  tanh_scale: 15.0           # numerator of Eq. (10): 50[1+tanh(scale/50 * Z)]
  score_scale: 100.0         # Y_attr in [0, 100]
  neutral_score: 50.0        # returned when total firing strength < 1e-8
  firing_floor: 1.0e-8       # sum-w threshold below which the neutral score fires
  sigma_floor: 1.0e-4        # delta: numerical floor on Gaussian widths, Eq. (5)

experiment:
  # Train on 2022-2024 and evaluate strictly out-of-sample on the full 2025
  # calendar year -- the paper's canonical windows (Section 3.3.1). The raw bars
  # now cover 2022-01-05..2025-12-31 (AIRA only from 2024-02-12, KMGZ from
  # 2022-12-09), so the full three-year training history is available.
  train_start: "2022-01-01"  # canonical (paper): "2022-01-01"
  train_end: "2024-12-31"    # canonical (paper): "2024-12-31"
  test_start: "2025-01-01"   # canonical (paper): "2025-01-01"
  test_end: "2025-12-31"     # canonical (paper): "2025-12-31"
  # Pre-AGM window length M_pre in calendar days, Section 3.4.
  pre_agm_days: 45
  # AGM dates (YYYY-MM-DD) used to arm the masking window; lists are supported
  # so the training year carries Pre-AGM rows as well. The 2024 dates reuse the
  # 2025 month/day as a documented approximation -- replace with the exact KASE
  # disclosure dates when available.
  agm_dates:
    KMGZ: ["2024-05-16", "2025-05-16"]
    KZAP: ["2024-05-22", "2025-05-22"]
    KEGC: ["2024-05-14", "2025-05-14"]
    KZTO: ["2024-05-15", "2025-05-15"]
    KCEL: ["2024-06-13", "2025-06-13"]
    AIRA: ["2024-06-20", "2025-06-20"]
    KZTK: ["2024-05-29", "2025-05-29"]

tsk:
  # Section 3.2 -- subtractive clustering on min-max normalised inputs.
  # experiments/tune_tsk.py scans this block on an internal chronological split of
  # the training window (fit 2022-01-01..2023-07-01, validate 2023-07-01..2024-12-31,
  # maximise validated Rank IC s.t. C <= 100). On the extended 2022-2024 sample the
  # scan prefers K=3/radius=0.4/ridge=100 (validation IC +0.085 at C=59.9, versus
  # +0.051 at C=77.1 for the deployed setting -- rank 22 of 36). Out-of-sample the
  # pick only wins the *daily* pooled Rank IC (+0.064 vs -0.024) and loses every
  # metric the portfolio actually depends on: monthly rebalance Rank IC (+0.172 vs
  # +0.438) and net Sharpe at 15 bps (+1.549 vs +2.582). The smaller model is the
  # better daily rater and the worse portfolio, so the deployed parameters are
  # retained -- the same call as the earlier rejection of the in-sample-preferred
  # setting, just with different numbers behind it.
  n_rules: 5                 # K = 5 (fixated after the sensitivity scan)
  cluster_radius: 0.5        # subtractive-clustering influence radius
  cluster_ratio: 0.5         # squash factor for the potential update
  mf: gaussian
  # Ridge penalty on the consequent least-squares solve (Eq. 9), selected on an
  # internal chronological split of the training window (fit 2022-01-01..2023-07-01,
  # validate 2023-07-01..2024-12-31, maximise validated rank IC subject to C <= 100).
  # A tiny value leaves the solve ill-conditioned: rule outputs then reach
  # |y_k| ~ 6e3 with cancelling signs, which inflates the masking cost by two
  # orders of magnitude. The scan prefers ridge=100 on validation IC; see the note
  # above for why the deployed value is retained instead.
  ridge_lambda: 10.0
  # Bound each rule output to the score domain at inference (default true). This
  # makes Proposition 1's constant C = max|y_k - Y_raw| <= 100 hold by
  # construction for any ridge value and any input extrapolation; the training
  # gradients are unaffected because predict() stays unclipped.
  clip_rule_outputs: true
  # Input scaling: "raw" (identity, canonical three-input model) or "minmax"
  # (train-fitted [0, 1] scaling). Use "minmax" whenever heterogeneous Tier-2
  # inputs (e.g. fundamentals) share the vector with dev_price.
  input_scaling: raw
  premise_lr: 1.0e-3         # eta, backward pass (widths only), Eq. (11)
  epochs: 200
  grad_clip: 5.0
  verbose_every: 25

masking:
  # Section 3.4 -- anti-frontrunning stochastic rule-weight masking.
  alpha: 0.05                # truncation bound; xi ~ N(0, (alpha/2)^2) on [-a, a]

payout:
  # Section 4.1, Eqs. (12)-(13) -- corporate payout mapping.
  kappa: 3.0                 # leverage penalty intensity
  tau: 1.0                   # Net Debt / EBITDA threshold

backtest:
  # Section 4.3.1 -- monthly top-N long portfolio and cost tiers.
  top_n: 3
  rebalance: monthly         # first trading day of each month
  cost_tiers_bps: [15, 25, 35, 50]   # round-trip execution costs
  bootstrap_B: 5000          # panel block bootstrap replications
  bootstrap_block: 30        # block length in trading days
